<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="States"><title>States</title><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The supervisor: four states, one way out of RUN, and no way out of SAFE except a reset</text><rect x="30.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="105.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">INIT</text><text x="105.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">WARM cycles</text><text x="105.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">kill = 1</text><rect x="260.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="335.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">READY</text><text x="335.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">waits for go and an</text><text x="335.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ACTIVE session</text><rect x="490.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="565.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">RUN</text><text x="565.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">orders may leave</text><text x="565.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">kill = 0</text><rect x="740.0" y="150.0" width="200.0" height="70.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="840.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">SAFE</text><text x="840.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">kill = 1, one logout,</text><text x="840.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">absorbing</text><line x1="182.0" y1="185.0" x2="252.6" y2="185.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="258.0,185.0 249.8,188.7 249.8,181.3" fill="#1f2a37"/><line x1="412.0" y1="185.0" x2="482.6" y2="185.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="488.0,185.0 479.8,188.7 479.8,181.3" fill="#1f2a37"/><line x1="642.0" y1="185.0" x2="732.6" y2="185.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="738.0,185.0 729.8,188.7 729.8,181.3" fill="#1f2a37"/><text x="220.0" y="175.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">WARM</text><text x="450.0" y="175.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">go</text><text x="690.0" y="175.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">any cause</text><text x="490.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-style="italic">causes in RUN: no feed byte for FT cycles | strategy slot held ST cycles | external trip | tracker fault | session not ACTIVE</text><text x="490.0" y="295.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-style="italic">a reset (rst_u, from the reset generator) returns every state to INIT</text><text x="490.0" y="340.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#c53030" text-anchor="middle" font-style="italic">the cause is latched (a bit for each that was true) and is the only record of why</text></svg>