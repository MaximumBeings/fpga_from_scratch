<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Builders"><title>Builders</title><rect x="0.5" y="0.5" width="959" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Store-and-forward against cut-through: when the first byte can leave</text><text x="20.0" y="62.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">store-and-forward</text><rect x="160.0" y="46.0" width="330.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="325.0" y="66.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">payload in: memory + length + checksum sum</text><rect x="494.0" y="46.0" width="60.0" height="34.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="524.0" y="66.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">calc</text><rect x="558.0" y="46.0" width="40.0" height="34.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="578.0" y="66.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">req</text><rect x="602.0" y="46.0" width="150.0" height="34.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="677.0" y="66.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">headers (42 B)</text><rect x="756.0" y="46.0" width="190.0" height="34.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="851.0" y="66.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">payload from memory</text><text x="20.0" y="142.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#2f855a" text-anchor="start" font-weight="bold">cut-through</text><rect x="160.0" y="126.0" width="60.0" height="34.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="190.0" y="146.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">calc</text><rect x="224.0" y="126.0" width="40.0" height="34.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="244.0" y="146.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">req</text><rect x="268.0" y="126.0" width="150.0" height="34.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="343.0" y="146.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">headers (42 B)</text><rect x="422.0" y="126.0" width="330.0" height="34.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="587.0" y="146.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">payload passes through (one byte per clock)</text><line x1="160.0" y1="190.0" x2="160.0" y2="104.2" stroke="#c53030" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="160.0,100.0 162.9,106.4 157.1,106.4" fill="#c53030"/><text x="160.0" y="210.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#c53030" text-anchor="middle">descriptor accepted</text><line x1="602.0" y1="250.0" x2="602.0" y2="92.2" stroke="#a0aec0" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="602.0,88.0 604.9,94.4 599.1,94.4" fill="#a0aec0"/><text x="602.0" y="266.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">first byte on the wire (store-and-forward)</text><line x1="268.0" y1="250.0" x2="268.0" y2="172.2" stroke="#a0aec0" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="268.0,168.0 270.9,174.4 265.1,174.4" fill="#a0aec0"/><text x="268.0" y="266.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">first byte on the wire (cut-through)</text><text x="480.0" y="306.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">store-and-forward waits for the whole payload (L cycles) and 12 cycles of arithmetic; cut-through waits only for the arithmetic on the length</text><text x="480.0" y="330.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">but a cut-through frame cannot pause: once the preamble is out the payload must arrive every cycle, or the MAC underruns</text><text x="480.0" y="368.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">and store-and-forward holds one frame at a time: while it sends, it cannot receive (utilisation about 51% at 1,000 bytes)</text></svg>