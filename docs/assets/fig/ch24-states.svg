" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">DEAD</text><text x="445.0" y="289.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">quiet for 3 HB</text><line x1="132.0" y1="178.0" x2="182.6" y2="178.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="188.0,178.0 179.8,181.7 179.8,174.3" fill="#1f2a37"/><line x1="302.0" y1="178.0" x2="372.6" y2="178.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="378.0,178.0 369.8,181.7 369.8,174.3" fill="#1f2a37"/><line x1="245.0" y1="148.0" x2="249.5" y2="103.4" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round"/><polygon points="250.0,98.0 252.8,106.5 245.5,105.8" fill="#1f2a37"/><line x1="500.0" y1="178.0" x2="572.6" y2="178.0" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round"/><polygon points="578.0,178.0 569.8,181.7 569.8,174.3" fill="#1f2a37"/><line x1="470.0" y1="208.0" x2="594.9" y2="248.3" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round"/><polygon points="600.0,250.0 591.1,251.0 593.3,244.0" fill="#1f2a37"/><line x1="440.0" y1="208.0" x2="440.0" y2="242.6" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round"/><polygon points="440.0,248.0 436.3,239.8 443.7,239.8" fill="#1f2a37"/><line x1="260.0" y1="148.0" x2="375.1" y2="92.3" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round"/><polygon points="380.0,90.0 374.2,96.9 371.0,90.3" fill="#1f2a37"/><text x="160.0" y="140.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">LOGIN request</text><text x="340.0" y="168.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">'A'</text><text x="250.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">'J'</text><text x="540.0" y="168.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">bad S</text><text x="380.0" y="125.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">no answer in TL</text><text x="490.0" y="345.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">no state leaves REJECTED, DEAD, GAP or CLOSED except reset: orders are refused until the session is built again (it fails closed)</text></svg>