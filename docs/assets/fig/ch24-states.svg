<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Session"><title>Session</title><rect x="0.5" y="0.5" width="979" height="379" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The client's session: it only ever leaves ACTIVE for a state that refuses orders</text><rect x="30.0" y="150.0" width="100.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="80.0" y="174.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">IDLE</text><text x="80.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">after reset</text><rect x="190.0" y="150.0" width="110.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="245.0" y="174.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">LOGIN</text><text x="245.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">login sent</text><rect x="380.0" y="150.0" width="120.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="440.0" y="174.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ACTIVE</text><text x="440.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">orders flow</text><rect x="190.0" y="40.0" width="130.0" height="56.0" rx="8" fill="#fed7d7" stroke