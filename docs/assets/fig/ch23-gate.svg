<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Risk gate"><title>Risk gate</title><rect x="0.5" y="0.5" width="979" height="419" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The risk gate: an order passes only if every limit holds after it; the gate fails closed</text><rect x="20.0" y="150.0" width="110.0" height="80.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="75.0" y="179.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">event</text><text x="75.0" y="193.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">order, fill,</text><text x="75.0" y="208.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">cancel</text><rect x="160.0" y="150.0" width="130.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="225.0" y="172.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">stage 1</text><text x="225.0" y="186.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">register the event,</text><text x="225.0" y="201.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">price x quantity</text><text x="225.0" y="215.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(the multiplier)</text><rect x="320.0" y="60.0" width="330.0" height="110.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="485.0" y="97.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">stage 2: the checks, in order</text><text x="485.0" y="111.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">KILL, DISARMED (or a fault), BADIDX, QTY, BAND,</text><text x="485.0" y="126.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ONOT, POS (worst case, open orders counted),</text><text x="485.0" y="140.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">NOT (total open notional), RATE (a token)</text><rect x="320.0" y="200.0" width="330.0" height="90.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="485.0" y="227.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">stage 2: the update (same cycle)</text><text x="485.0" y="241.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">an accepted order adds to the open quantity, the</text><text x="485.0" y="256.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">notional and takes a token; a release subtracts;</text><text x="485.0" y="270.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">a release of more than is open is a FAULT (latched)</text><rect x="680.0" y="150.0" width="130.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="745.0" y="179.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">answer</text><text x="745.0" y="193.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">result + the</text><text x="745.0" y="208.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">state touched</text><rect x="840.0" y="150.0" width="120.0" height="80.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="900.0" y="172.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">fail closed</text><text x="900.0" y="186.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">disarmed at reset,</text><text x="900.0" y="201.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">limits 0, kill,</text><text x="900.0" y="215.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">fault latch</text><line x1="132.0" y1="190.0" x2="152.6" y2="190.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="158.0,190.0 149.8,193.7 149.8,186.3" fill="#1f2a37"/><line x1="292.0" y1="175.0" x2="315.5" y2="129.8" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="318.0,125.0 317.5,134.0 311.0,130.6" fill="#1f2a37"/><line x1="292.0" y1="200.0" x2="315.1" y2="235.5" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="318.0,240.0 310.4,235.1 316.6,231.1" fill="#1f2a37"/><line x1="652.0" y1="125.0" x2="675.5" y2="170.2" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="678.0,175.0 671.0,169.4 677.5,166.0" fill="#1f2a37"/><line x1="652.0" y1="240.0" x2="674.8" y2="209.3" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="678.0,205.0 676.0,213.8 670.2,209.4" fill="#1f2a37"/><line x1="812.0" y1="190.0" x2="832.6" y2="190.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="838.0,190.0 829.8,193.7 829.8,186.3" fill="#1f2a37"/><text x="490.0" y="330.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">one event per cycle, answered two cycles after it is offered; state in registers; decision and update in ONE cycle (no hazard between events)</text><text x="490.0" y="355.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">limits at run time: max long / short, max quantity, max order notional, max total notional, token bucket; per symbol a price band</text></svg>