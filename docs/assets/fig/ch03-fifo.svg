<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="Asynchronous FIFO"><title>Asynchronous FIFO</title><rect x="0.5" y="0.5" width="939" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The asynchronous FIFO: data stays put in the memory; only Gray-coded pointers cross</text><rect x="20.0" y="44.0" width="440.0" height="312.0" rx="10" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.5"/><text x="240.0" y="66.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">write clock domain</text><rect x="480.0" y="44.0" width="440.0" height="312.0" rx="10" fill="#feebc8" stroke="#dd6b20" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.5"/><text x="700.0" y="66.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#dd6b20" text-anchor="middle" font-weight="bold">read clock domain</text><rect x="40.0" y="90.0" width="150.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="115.0" y="114.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">write pointer</text><text x="115.0" y="129.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">binary + Gray register</text><rect x="560.0" y="90.0" width="110.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="615.0" y="114.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">2-FF sync</text><text x="615.0" y="129.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(write ptr in)</text><rect x="740.0" y="90.0" width="160.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="820.0" y="114.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">empty: read pointer</text><text x="820.0" y="129.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">equals write pointer</text><line x1="192.0" y1="118.0" x2="552.6" y2="118.0" stroke="#6b46c1" stroke-width="2.2" stroke-linecap="round"/><polygon points="558.0,118.0 549.8,121.7 549.8,114.3" fill="#6b46c1"/><text x="375.0" y="108.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-weight="bold">write pointer, Gray coded</text><line x1="672.0" y1="118.0" x2="732.6" y2="118.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="738.0,118.0 729.8,121.7 729.8,114.3" fill="#1f2a37"/><rect x="40.0" y="290.0" width="150.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="115.0" y="314.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">full: write pointer</text><text x="115.0" y="328.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">a lap ahead of read</text><rect x="250.0" y="290.0" width="110.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="305.0" y="314.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">2-FF sync</text><text x="305.0" y="329.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(read ptr in)</text><rect x="750.0" y="290.0" width="150.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="825.0" y="314.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">read pointer</text><text x="825.0" y="329.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">binary + Gray register</text><line x1="748.0" y1="318.0" x2="367.4" y2="318.0" stroke="#6b46c1" stroke-width="2.2" stroke-linecap="round"/><polygon points="362.0,318.0 370.2,314.3 370.2,321.7" fill="#6b46c1"/><text x="560.0" y="308.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-weight="bold">read pointer, Gray coded</text><line x1="248.0" y1="318.0" x2="197.4" y2="318.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="192.0,318.0 200.2,314.3 200.2,321.7" fill="#1f2a37"/><rect x="380.0" y="170.0" width="180.0" height="80.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="470.0" y="206.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">memory</text><text x="470.0" y="221.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">wclk writes, rclk reads</text><line x1="115.0" y1="148.0" x2="115.0" y2="204.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="115.0,210.0 111.3,201.8 118.7,201.8" fill="#1f2a37"/><line x1="115.0" y1="210.0" x2="372.6" y2="210.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="378.0,210.0 369.8,213.7 369.8,206.3" fill="#1f2a37"/><text x="190.0" y="202.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="start">write data + address</text><line x1="562.0" y1="210.0" x2="819.6" y2="210.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="825.0,210.0 816.8,213.7 816.8,206.3" fill="#1f2a37"/><line x1="825.0" y1="210.0" x2="825.0" y2="153.4" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="825.0,148.0 828.7,156.2 821.3,156.2" fill="#1f2a37"/><line x1="825.0" y1="288.0" x2="825.0" y2="217.4" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="825.0,212.0 828.7,220.2 821.3,220.2" fill="#1f2a37"/><text x="600.0" y="202.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="start">read data (address from the read pointer)</text><text x="470.0" y="382.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">full is judged in the write domain, empty in the read domain; both are conservative (a stale pointer can only hold a flag longer)</text></svg>