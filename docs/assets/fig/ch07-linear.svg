<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="Linear"><title>Linear</title><rect x="0.5" y="0.5" width="939" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The CRC update is linear: each new register bit is an XOR of old register bits and data bits</text><rect x="30.0" y="60.0" width="190.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="125.0" y="77.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">bit-serial CRC</text><text x="125.0" y="91.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">shift, XOR with the</text><text x="125.0" y="106.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">polynomial when the</text><text x="125.0" y="120.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">feedback bit is 1</text><line x1="222.0" y1="95.0" x2="292.6" y2="95.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="298.0,95.0 289.8,98.7 289.8,91.3" fill="#1f2a37"/><text x="260.0" y="85.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle">run it</text><text x="260.0" y="109.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle">symbolically</text><rect x="300.0" y="60.0" width="210.0" height="70.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="405.0" y="77.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">each register bit is a</text><text x="405.0" y="91.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">SET of variables</text><text x="405.0" y="106.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(old state bits, data bits)</text><text x="405.0" y="120.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">XOR = set difference</text><line x1="512.0" y1="95.0" x2="582.6" y2="95.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="588.0,95.0 579.8,98.7 579.8,91.3" fill="#1f2a37"/><text x="550.0" y="85.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle">after N</text><text x="550.0" y="109.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle">data bits</text><rect x="590.0" y="60.0" width="320.0" height="70.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="750.0" y="84.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">step_k[j] = c[1] ^ c[3] ^ ... ^ d[0] ^ d[2] ^ ...</text><text x="750.0" y="98.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">one XOR equation per output bit</text><text x="750.0" y="113.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(the generated RTL: rtl/crc32_stream.sv)</text><text x="470.0" y="175.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">new_state = A_k(state)  XOR  B_k(data)</text><text x="470.0" y="205.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">A is a 32 x 32 matrix over GF(2), B is 32 x (8k): the FEEDBACK needs only A; B depends on the input alone and can be pipelined freely</text><text x="470.0" y="235.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">linearity also gives the proof used in this chapter: a linear function that agrees on a basis agrees everywhere</text></svg>