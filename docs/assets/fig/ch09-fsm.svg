<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="FSM"><title>FSM</title><rect x="0.5" y="0.5" width="959" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">hdr_filter: follow the headers one byte per clock</text><circle cx="110.0" cy="100.0" r="36.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="110.0" y="105.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">ETH</text><circle cx="110.0" cy="240.0" r="36.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="110.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">VLAN</text><circle cx="110.0" cy="350.0" r="36.0" fill="#edf2f7" stroke="#a0aec0" stroke-width="2.2"/><text x="110.0" y="355.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">NIP</text><circle cx="400.0" cy="100.0" r="36.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="400.0" y="105.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">IP</text><circle cx="690.0" cy="70.0" r="36.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="690.0" y="75.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">UDP</text><circle cx="690.0" cy="200.0" r="36.0" fill="#edf2f7" stroke="#a0aec0" stroke-width="2.2"/><text x="690.0" y="205.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">XIP</text><line x1="147.0" y1="96.0" x2="355.6" y2="96.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="361.0,96.0 352.8,99.7 352.8,92.3" fill="#1f2a37"/><text x="255.0" y="86.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">type = 0x0800</text><line x1="110.0" y1="138.0" x2="110.0" y2="196.6" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="110.0,202.0 106.3,193.8 113.7,193.8" fill="#1f2a37"/><text x="118.0" y="178.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">VLAN type</text><path d="M146,232 C250,232 300,150 366,118" fill="none" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="300.0" y="205.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">type = 0x0800</text><path d="M78,222 C30,200 30,140 78,118" fill="none" stroke="#1f2a37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="18.0" y="172.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="start">2nd tag</text><text x="150.0" y="340.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="start">(from ETH or VLAN: any type that is not a tag or 0x0800)</text><line x1="110.0" y1="277.0" x2="110.0" y2="306.6" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="110.0,312.0 106.3,303.8 113.7,303.8" fill="#a0aec0"/><text x="120.0" y="296.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="start">any other type</text><line x1="436.0" y1="90.0" x2="648.6" y2="72.4" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="654.0,72.0 646.1,76.3 645.5,69.0" fill="#1f2a37"/><text x="545.0" y="66.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">header done, protocol 17</text><line x1="432.0" y1="120.0" x2="652.8" y2="186.4" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="658.0,188.0 649.1,189.1 651.2,182.1" fill="#1f2a37"/><text x="520.0" y="168.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">header done, other protocol</text><text x="740.0" y="62.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">UDP: ports, length, checksum;</text><text x="740.0" y="80.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">the segment is summed up to its</text><text x="740.0" y="98.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">length; an odd last byte is the</text><text x="740.0" y="116.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">high half of a word</text><text x="740.0" y="205.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">XIP: count the bytes only</text><text x="740.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">NIP: not IP, nothing more to follow</text><text x="560.0" y="340.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">the last byte of the frame (valid and last) returns every control register to ETH;</text><text x="560.0" y="358.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">the state it ended in is copied for the verdict</text><text x="480.0" y="388.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#dd6b20" text-anchor="middle" font-weight="bold">positions are one-hot shift registers (IP bytes 0 to 19, UDP bytes 0 to 7): a field is captured by one LUT, if (position) field &lt;= byte</text></svg>