<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Flow"><title>Flow</title><rect x="0.5" y="0.5" width="979" height="379" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">From a grammar to a parser: the generator, the independent model, and what is compared</text><rect x="30.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="125.0" y="106.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">model/grammar.py</text><text x="125.0" y="122.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">types, fields, widths</text><rect x="30.0" y="230.0" width="190.0" height="80.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="125.0" y="258.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">model/itch_gold.py</text><text x="125.0" y="274.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">its own struct layouts</text><text x="125.0" y="289.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">(from the protocol)</text><rect x="290.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="385.0" y="114.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">tools/gen_parser.py</text><rect x="550.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="645.0" y="106.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">rtl/mold_itch.sv</text><text x="645.0" y="122.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">one byte per clock</text><rect x="550.0" y="230.0" width="190.0" height="80.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="645.0" y="266.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">stimulus: packets,</text><text x="645.0" y="282.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">faults, gaps, resets</text><rect x="790.0" y="150.0" width="160.0" height="80.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="870.0" y="179.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">compare:</text><text x="870.0" y="194.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">every message and</text><text x="870.0" y="209.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">packet end, at its cycle</text><line x1="222.0" y1="110.0" x2="282.6" y2="110.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="288.0,110.0 279.8,113.7 279.8,106.3" fill="#1f2a37"/><line x1="482.0" y1="110.0" x2="542.6" y2="110.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="548.0,110.0 539.8,113.7 539.8,106.3" fill="#1f2a37"/><line x1="742.0" y1="125.0" x2="784.3" y2="171.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="788.0,175.0 779.7,171.4 785.1,166.5" fill="#1f2a37"/><line x1="222.0" y1="270.0" x2="782.6" y2="205.6" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="788.0,205.0 780.3,209.6 779.4,202.3" fill="#1f2a37"/><line x1="645.0" y1="230.0" x2="645.0" y2="157.4" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="645.0,152.0 648.7,160.2 641.3,160.2" fill="#1f2a37"/><line x1="222.0" y1="275.0" x2="542.6" y2="275.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="548.0,275.0 539.8,278.7 539.8,271.3" fill="#1f2a37"/><text x="490.0" y="350.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">the model never reads the grammar or the generator: a mistake copied into both layouts is the one the test cannot see</text></svg>