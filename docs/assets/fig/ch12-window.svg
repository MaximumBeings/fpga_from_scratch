<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-label="Window"><title>Window</title><rect x="0.5" y="0.5" width="979" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The acceptability test: where may a segment lie, relative to RCV.NXT and the window</text><line x1="40.0" y1="130.0" x2="940.0" y2="130.0" stroke="#1f2a37" stroke-width="2.5" stroke-linecap="round"/><line x1="200.0" y1="112.0" x2="200.0" y2="148.0" stroke="#c53030" stroke-width="2.5" stroke-linecap="round"/><text x="200.0" y="100.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">RCV.NXT</text><line x1="620.0" y1="112.0" x2="620.0" y2="148.0" stroke="#c53030" stroke-width="2.5" stroke-linecap="round"/><text x="620.0" y="100.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">RCV.NXT + wnd</text><rect x="200.0" y="118.0" width="420.0" height="24.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5" opacity="0.7"/><text x="410.0" y="135.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f855a" text-anchor="middle" font-weight="bold">the window: wnd bytes</text><rect x="215.0" y="175.0" width="225.0" height="24.0" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.6"/><text x="327.5" y="192.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">starts in the window: accepted</text><rect x="70.0" y="210.0" width="260.0" height="24.0" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.6"/><text x="200.0" y="227.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">ends in the window (starts before): accepted</text><rect x="60.0" y="245.0" width="130.0" height="24.0" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.6"/><text x="125.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">entirely before: refused</text><rect x="640.0" y="175.0" width="180.0" height="24.0" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.6"/><text x="730.0" y="192.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">entirely after: refused</text><rect x="90.0" y="280.0" width="670.0" height="24.0" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.6"/><text x="425.0" y="297.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">starts before and ends after the window: refused by the RFC rule</text><text x="640.0" y="222.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">length 0: accepted only at offsets 0 .. wnd - 1</text><text x="640.0" y="242.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">window 0: only an empty segment at RCV.NXT</text></svg>