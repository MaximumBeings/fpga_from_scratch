<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-label="Sender"><title>Sender</title><rect x="0.5" y="0.5" width="979" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The sender's view of the sequence space: what is acknowledged, in flight, allowed, and still to come</text><rect x="40.0" y="110.0" width="196.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="138.0" y="138.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">acknowledged</text><rect x="240.0" y="110.0" width="236.0" height="50.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="358.0" y="131.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">in flight (sent, not</text><text x="358.0" y="145.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">acknowledged)</text><rect x="480.0" y="110.0" width="196.0" height="50.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="578.0" y="131.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">may be sent now (inside</text><text x="578.0" y="145.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">the window)</text><rect x="680.0" y="110.0" width="116.0" height="50.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="738.0" y="131.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">beyond the</text><text x="738.0" y="145.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">window</text><rect x="800.0" y="110.0" width="136.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="868.0" y="138.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">not yet written</text><line x1="238.0" y1="90.0" x2="238.0" y2="175.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><text x="238.0" y="82.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">SND.UNA</text><text x="238.0" y="192.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle">oldest unacknowledged</text><line x1="478.0" y1="90.0" x2="478.0" y2="175.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><text x="478.0" y="82.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">SND.NXT</text><text x="478.0" y="192.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle">next to send</text><line x1="678.0" y1="90.0" x2="678.0" y2="175.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><text x="678.0" y="82.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">SND.UNA + wnd</text><text x="678.0" y="192.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle">window edge</text><line x1="798.0" y1="90.0" x2="798.0" y2="175.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><text x="798.0" y="82.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">end</text><text x="798.0" y="192.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle">data the application has written</text><text x="360.0" y="236.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle">SND.MAX (not drawn): the highest sequence number ever sent. After a timeout SND.NXT goes back to SND.UNA;</text><text x="360.0" y="254.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle">bytes between SND.NXT and SND.MAX are then sent again and flagged as retransmissions (no RTT sample from them: Karn).</text><text x="490.0" y="300.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">a new ACK in (SND.UNA, SND.MAX] moves SND.UNA right; a window update moves the green/red edge</text></svg>