<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Skid buffer"><title>Skid buffer</title><rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The skid stage: an output register, a skid register, and a ready signal that comes from a register</text><rect x="60.0" y="130.0" width="120.0" height="60.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="120.0" y="156.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">in_data</text><text x="120.0" y="172.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">in_valid</text><rect x="300.0" y="70.0" width="150.0" height="50.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="375.0" y="99.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">skid register</text><rect x="300.0" y="190.0" width="150.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="375.0" y="229.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">mux: skid or input</text><rect x="560.0" y="130.0" width="150.0" height="60.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="635.0" y="164.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">output register</text><rect x="790.0" y="130.0" width="120.0" height="60.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="850.0" y="156.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">out_data</text><text x="850.0" y="172.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">out_valid</text><line x1="182.0" y1="160.0" x2="293.2" y2="102.5" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="298.0,100.0 292.4,107.0 289.0,100.5" fill="#1f2a37"/><line x1="182.0" y1="165.0" x2="293.0" y2="212.9" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="298.0,215.0 289.0,215.1 291.9,208.4" fill="#1f2a37"/><line x1="452.0" y1="95.0" x2="452.0" y2="144.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="452.0,150.0 448.3,141.8 455.7,141.8" fill="#1f2a37"/><line x1="452.0" y1="225.0" x2="553.1" y2="177.3" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="558.0,175.0 552.1,181.8 549.0,175.2" fill="#1f2a37"/><line x1="712.0" y1="160.0" x2="782.6" y2="160.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="788.0,160.0 779.8,163.7 779.8,156.3" fill="#1f2a37"/><line x1="790.0" y1="290.0" x2="187.4" y2="290.0" stroke="#c53030" stroke-width="1.8" stroke-linecap="round"/><polygon points="182.0,290.0 190.2,286.3 190.2,293.7" fill="#c53030"/><text x="480.0" y="282.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c53030" text-anchor="middle">out_ready (from the sink)</text><text x="240.0" y="56.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2b6cb0" text-anchor="middle">in_ready = !skid_valid (a register)</text><text x="470.0" y="310.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">In a stall the arriving item goes to the skid register; in_ready then falls in the NEXT cycle.</text><text x="470.0" y="328.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">When the output frees, the skid item moves first.</text></svg>