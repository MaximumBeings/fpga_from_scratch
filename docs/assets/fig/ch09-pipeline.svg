<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Pipeline"><title>Pipeline</title><rect x="0.5" y="0.5" width="959" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The verdict is pipelined: latency 3, throughput one byte per clock</text><rect x="50.0" y="70.0" width="190.0" height="96.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="145.0" y="98.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">absorb</text><text x="145.0" y="114.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">state and sums update with</text><text x="145.0" y="130.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">the byte; the last byte</text><text x="145.0" y="145.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">arrives</text><text x="145.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">cycle t (last byte in)</text><rect x="275.0" y="70.0" width="190.0" height="96.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="370.0" y="98.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">facts</text><text x="370.0" y="114.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">registers become single-</text><text x="370.0" y="130.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">bit facts, each one</text><text x="370.0" y="145.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">comparison deep</text><line x1="242.0" y1="118.0" x2="267.6" y2="118.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="273.0,118.0 264.8,121.7 264.8,114.3" fill="#1f2a37"/><text x="370.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">cycle t+1</text><rect x="500.0" y="70.0" width="190.0" height="96.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="595.0" y="98.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">cause</text><text x="595.0" y="114.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">priority of the facts;</text><text x="595.0" y="130.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">field copies; count</text><text x="595.0" y="145.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">strobes</text><line x1="467.0" y1="118.0" x2="492.6" y2="118.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="498.0,118.0 489.8,121.7 489.8,114.3" fill="#1f2a37"/><text x="595.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">cycle t+2</text><rect x="725.0" y="70.0" width="190.0" height="96.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="820.0" y="106.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">out</text><text x="820.0" y="122.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">m_data, m_last, m_bad,</text><text x="820.0" y="137.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">cause and fields leave</text><line x1="692.0" y1="118.0" x2="717.6" y2="118.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="723.0,118.0 714.8,121.7 714.8,114.3" fill="#1f2a37"/><text x="820.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">cycle t+3 (out)</text><text x="480.0" y="226.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">the registers of the frame are cleared by the first byte of the next frame, which can arrive in cycle t+1: the facts are taken in t+1</text><text x="480.0" y="248.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">back-to-back frames therefore never wait: each stage holds a different frame</text><text x="480.0" y="276.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#dd6b20" text-anchor="middle" font-weight="bold">cause priority: mac_bad &gt; trunc &gt; not_ip &gt; ip_bad &gt; not_udp &gt; udp_bad &gt; not_ours &gt; forward</text></svg>