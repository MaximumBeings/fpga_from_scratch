<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-label="Headers"><title>Headers</title><rect x="0.5" y="0.5" width="959" height="489" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A UDP frame: the headers the filter follows, the fields it captures, the bytes each checksum covers</text><rect x="20.0" y="48.0" width="84.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="62.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">dst MAC</text><text x="62.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">6 bytes</text><rect x="108.0" y="48.0" width="84.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="150.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">src MAC</text><text x="150.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">6 bytes</text><rect x="196.0" y="48.0" width="60.0" height="50.0" rx="8" fill="#fefcbf" stroke="#dd6b20" stroke-width="1.8"/><text x="226.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">type</text><text x="226.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">2 bytes</text><rect x="260.0" y="48.0" width="118.0" height="50.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="319.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">VLAN tags</text><text x="319.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">0 to 2 x 4 bytes</text><rect x="382.0" y="48.0" width="146.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="455.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">IPv4 header</text><text x="455.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">20 to 60 bytes</text><rect x="532.0" y="48.0" width="106.0" height="50.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="585.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">UDP header</text><text x="585.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">8 bytes</text><rect x="642.0" y="48.0" width="146.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="715.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">payload</text><text x="715.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">UDP length - 8 bytes</text><rect x="792.0" y="48.0" width="86.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="835.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">pad</text><text x="835.0" y="89.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#51606f" text-anchor="middle" font-style="italic">to 60 bytes bytes</text><text x="20.0" y="118.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start" font-style="italic">A VLAN tag is a type 0x8100 or 0x88A8 followed by 2 bytes of tag (the low 12 bits are the VLAN id) and the real type; the filter follows at most two.</text><text x="20.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2b6cb0" text-anchor="start" font-weight="bold">IPv4 header, byte by byte (blue = captured; the options of a longer header are summed and skipped):</text><rect x="40.0" y="160.0" width="40.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="60.0" y="182.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">ver</text><text x="60.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">0</text><rect x="83.0" y="160.0" width="40.0" height="38.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="103.0" y="182.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#1f2a37" text-anchor="middle">tos</text><text x="103.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">1</text><rect x="126.0" y="160.0" width="83.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="167.5" y="182.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">total length</text><text x="167.5" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">2</text><rect x="212.0" y="160.0" width="83.0" height="38.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="253.5" y="182.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2a37" text-anchor="middle">id</text><text x="253.5" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">4</text><rect x="298.0" y="160.0" width="83.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="339.5" y="182.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">flags/offset</text><text x="339.5" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">6</text><rect x="384.0" y="160.0" width="40.0" height="38.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="404.0" y="182.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#1f2a37" text-anchor="middle">ttl</text><text x="404.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">8</text><rect x="427.0" y="160.0" width="40.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="447.0" y="182.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">proto</text><text x="447.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">9</text><rect x="470.0" y="160.0" width="83.0" height="38.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="511.5" y="182.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2a37" text-anchor="middle">checksum</text><text x="511.5" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">10</text><rect x="556.0" y="160.0" width="169.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="640.5" y="182.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">source address</text><text x="640.5" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">12</text><rect x="728.0" y="160.0" width="169.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="812.5" y="182.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">destination address</text><text x="812.5" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">16</text><text x="40.0" y="230.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="start" font-style="italic">byte 0 holds the version (must be 4) and IHL (the header is IHL x 4 bytes, at least 20)</text><text x="20.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="start" font-weight="bold">UDP header (green = captured):</text><rect x="40.0" y="274.0" width="117.4" height="38.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="98.7" y="296.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">source port</text><text x="98.7" y="326.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">0</text><rect x="160.4" y="274.0" width="117.4" height="38.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="219.1" y="296.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">destination port</text><text x="219.1" y="326.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">2</text><rect x="280.8" y="274.0" width="117.4" height="38.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="339.5" y="296.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">length</text><text x="339.5" y="326.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">4</text><rect x="401.2" y="274.0" width="117.4" height="38.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="459.9" y="296.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">checksum</text><text x="459.9" y="326.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle">6</text><text x="541.6" y="288.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f855a" text-anchor="start" font-weight="bold">pseudo-header (not on the wire):</text><text x="541.6" y="306.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="start">source address, destination address,</text><text x="541.6" y="322.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="start">0x00 + protocol (17), UDP length</text><path d="M40,363 L40,372 L900,372 L900,363" fill="none" stroke="#2b6cb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="470.0" y="390.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">IP header checksum: sum of the header's 16-bit words is 0xFFFF (IHL x 4 bytes)</text><path d="M40,419 L40,428 L851.5999999999999,428 L851.5999999999999,419" fill="none" stroke="#2f855a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="445.8" y="446.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f855a" text-anchor="middle" font-weight="bold">UDP checksum: pseudo-header + UDP header + payload, UDP length bytes only (not the pad); a checksum field of 0 means 'none'</text><text x="480.0" y="478.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">type 0x0800 = IPv4; any other type (after at most two tags) is not_ip</text></svg>