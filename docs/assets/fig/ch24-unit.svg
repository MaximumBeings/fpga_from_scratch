<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="Transmitter"><title>Transmitter</title><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The transmitter: a template patched in one cycle, then W bytes per beat, no gap between packets</text><rect x="20.0" y="140.0" width="120.0" height="90.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="80.0" y="167.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">request</text><text x="80.0" y="181.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">order, cancel,</text><text x="80.0" y="196.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">replace, login,</text><text x="80.0" y="210.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">logout</text><rect x="170.0" y="70.0" width="190.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="265.0" y="102.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">template (configuration)</text><text x="265.0" y="116.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">stock name per symbol, firm,</text><text x="265.0" y="131.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">display, capacity, user,</text><text x="265.0" y="145.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">password, sequence number</text><rect x="170.0" y="200.0" width="190.0" height="90.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="265.0" y="227.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">patch: token, side, shares,</text><text x="265.0" y="241.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">price, tif into the fixed bytes</text><text x="265.0" y="256.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(wiring and a multiplexer:</text><text x="265.0" y="270.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">one cycle)</text><rect x="400.0" y="140.0" width="170.0" height="90.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="485.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">32-byte packet buffer</text><text x="485.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">len 2 | type | payload</text><text x="485.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">31, 12, 25, 15 or 3 bytes</text><rect x="600.0" y="140.0" width="150.0" height="90.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="675.0" y="167.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">beats: W bytes</text><text x="675.0" y="181.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">first byte first,</text><text x="675.0" y="196.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ceil(bytes / W)</text><text x="675.0" y="210.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">beats</text><rect x="780.0" y="70.0" width="180.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="870.0" y="97.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">session state</text><text x="870.0" y="111.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">IDLE LOGIN ACTIVE ...</text><text x="870.0" y="126.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">heartbeat and quiet timers</text><text x="870.0" y="140.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">expected sequence number</text><rect x="780.0" y="200.0" width="180.0" height="90.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="870.0" y="227.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">server events</text><text x="870.0" y="241.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">A accepted, J rejected,</text><text x="870.0" y="256.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">H heartbeat, S sequenced,</text><text x="870.0" y="270.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">Z end of session</text><line x1="142.0" y1="185.0" x2="165.9" y2="240.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="168.0,245.0 161.4,238.9 168.1,236.0" fill="#1f2a37"/><line x1="142.0" y1="175.0" x2="165.3" y2="134.7" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="168.0,130.0 167.1,139.0 160.7,135.3" fill="#1f2a37"/><line x1="362.0" y1="120.0" x2="394.8" y2="165.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="398.0,170.0 390.2,165.5 396.2,161.2" fill="#1f2a37"/><line x1="362.0" y1="245.0" x2="394.6" y2="204.2" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="398.0,200.0 395.7,208.7 390.0,204.1" fill="#1f2a37"/><line x1="572.0" y1="185.0" x2="592.6" y2="185.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="598.0,185.0 589.8,188.7 589.8,181.3" fill="#1f2a37"/><line x1="870.0" y1="198.0" x2="870.0" y2="167.4" stroke="#2b6cb0" stroke-width="1.4" stroke-linecap="round"/><polygon points="870.0,162.0 873.7,170.2 866.3,170.2" fill="#2b6cb0"/><line x1="778.0" y1="115.0" x2="485.4" y2="137.6" stroke="#2b6cb0" stroke-width="1.2" stroke-linecap="round"/><polygon points="480.0,138.0 487.9,133.7 488.5,141.0" fill="#2b6cb0"/><text x="490.0" y="335.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">ready = at most W bytes left in the buffer and no heartbeat due; the next packet's first beat follows the last beat of this one</text><text x="490.0" y="360.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">first byte on the wire in the cycle after acceptance, for every W</text></svg>