<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Signal unit"><title>Signal unit</title><rect x="0.5" y="0.5" width="979" height="379" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The signal unit: one division, one multiplication, one addition, bit for bit</text><rect x="20.0" y="140.0" width="120.0" height="90.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="80.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">top of book</text><text x="80.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">bid price, shares</text><text x="80.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ask price, shares</text><rect x="170.0" y="140.0" width="130.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="235.0" y="167.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">stage 0</text><text x="235.0" y="181.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">both sides?</text><text x="235.0" y="196.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">D = Qb + Qa</text><text x="235.0" y="210.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">S = Pa - Pb, Pa + Pb</text><rect x="330.0" y="140.0" width="150.0" height="90.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="405.0" y="167.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">divider: F steps</text><text x="405.0" y="181.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">r = Qb; double,</text><text x="405.0" y="196.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">subtract D if it fits;</text><text x="405.0" y="210.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">pipelined or shared</text><rect x="510.0" y="140.0" width="130.0" height="90.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="575.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">A: round</text><text x="575.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">w = t + (2r &gt;= D)</text><text x="575.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">imb = 2w - 2^F</text><rect x="670.0" y="140.0" width="120.0" height="90.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="730.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">B: multiply</text><text x="730.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">S x w</text><text x="730.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(a DSP block)</text><rect x="820.0" y="140.0" width="140.0" height="90.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="890.0" y="174.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">C: add, gate</text><text x="890.0" y="188.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">micro = Pb 2^F + S w</text><text x="890.0" y="203.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">all 0 if a side is empty</text><line x1="142.0" y1="185.0" x2="162.6" y2="185.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="168.0,185.0 159.8,188.7 159.8,181.3" fill="#1f2a37"/><line x1="302.0" y1="185.0" x2="322.6" y2="185.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="328.0,185.0 319.8,188.7 319.8,181.3" fill="#1f2a37"/><line x1="482.0" y1="185.0" x2="502.6" y2="185.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="508.0,185.0 499.8,188.7 499.8,181.3" fill="#1f2a37"/><line x1="642.0" y1="185.0" x2="662.6" y2="185.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="668.0,185.0 659.8,188.7 659.8,181.3" fill="#1f2a37"/><line x1="792.0" y1="185.0" x2="812.6" y2="185.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="818.0,185.0 809.8,188.7 809.8,181.3" fill="#1f2a37"/><text x="490.0" y="290.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">answer in cycle a + F + 4;  pipelined divider: one book per cycle;  shared divider: one book per F + 4 cycles</text><text x="490.0" y="315.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">outputs: ok, mid (half ticks), spread, cross, lock, w, imbalance (Q1.F), microprice (ticks x 2^F)</text></svg>