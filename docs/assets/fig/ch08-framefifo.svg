<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" role="img" aria-label="Frame FIFO"><title>Frame FIFO</title><rect x="0.5" y="0.5" width="939" height="279" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">frame_fifo: write pointer, commit pointer, read pointer</text><rect x="60.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="96.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="132.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="168.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="204.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="240.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="276.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="312.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.2"/><rect x="348.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#fefcbf" stroke="#dd6b20" stroke-width="1.2"/><rect x="384.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#fefcbf" stroke="#dd6b20" stroke-width="1.2"/><rect x="420.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#fefcbf" stroke="#dd6b20" stroke-width="1.2"/><rect x="456.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#fefcbf" stroke="#dd6b20" stroke-width="1.2"/><rect x="492.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#fefcbf" stroke="#dd6b20" stroke-width="1.2"/><rect x="528.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="564.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="600.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="636.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="672.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="708.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="744.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="780.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><rect x="816.0" y="90.0" width="34.0" height="46.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/><line x1="186.0" y1="64.0" x2="186.0" y2="82.6" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round"/><polygon points="186.0,88.0 182.3,79.8 189.7,79.8" fill="#2b6cb0"/><text x="186.0" y="58.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">rptr</text><line x1="366.0" y1="70.0" x2="366.0" y2="82.6" stroke="#2f855a" stroke-width="2" stroke-linecap="round"/><polygon points="366.0,88.0 362.3,79.8 369.7,79.8" fill="#2f855a"/><text x="366.0" y="58.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="middle" font-weight="bold">cptr</text><line x1="546.0" y1="70.0" x2="546.0" y2="82.6" stroke="#dd6b20" stroke-width="2" stroke-linecap="round"/><polygon points="546.0,88.0 542.3,79.8 549.7,79.8" fill="#dd6b20"/><text x="546.0" y="58.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#dd6b20" text-anchor="middle" font-weight="bold">wptr</text><text x="168.0" y="160.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f855a" text-anchor="start">committed frames: the reader sees only these (read pointer to commit pointer)</text><text x="348.0" y="182.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#dd6b20" text-anchor="start">frame being written: invisible until its last byte arrives good</text><text x="470.0" y="218.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">last byte good: commit pointer := write pointer.    last byte bad, or no room: write pointer := commit pointer (the frame vanishes)</text><text x="470.0" y="244.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">the reader sees a frame one cycle after the commit: a synchronous read of an address being written returns the OLD data</text></svg>