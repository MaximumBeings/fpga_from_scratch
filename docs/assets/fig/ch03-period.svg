<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="Period equation"><title>Period equation</title><rect x="0.5" y="0.5" width="939" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One clock period must cover everything between two flip-flops</text><rect x="60.0" y="90.0" width="90.0" height="50.0" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="105.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">clock-to-q</text><rect x="150.0" y="90.0" width="90.0" height="50.0" rx="4" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="195.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">LUT</text><rect x="240.0" y="90.0" width="130.0" height="50.0" rx="4" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="305.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">route</text><rect x="370.0" y="90.0" width="90.0" height="50.0" rx="4" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="415.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">LUT</text><rect x="460.0" y="90.0" width="110.0" height="50.0" rx="4" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="515.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">route</text><rect x="570.0" y="90.0" width="70.0" height="50.0" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="605.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">setup</text><rect x="640.0" y="90.0" width="150.0" height="50.0" rx="4" fill="#fefcbf" stroke="#51606f" stroke-width="1.8"/><text x="715.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">slack</text><line x1="60.0" y1="160.0" x2="790.0" y2="160.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><text x="425.0" y="182.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">clock period T</text><line x1="60.0" y1="60.0" x2="60.0" y2="82.6" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="60.0,88.0 56.3,79.8 63.7,79.8" fill="#1f2a37"/><text x="60.0" y="54.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">launch edge (flip-flop 1)</text><line x1="790.0" y1="60.0" x2="790.0" y2="82.6" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="790.0,88.0 786.3,79.8 793.7,79.8" fill="#1f2a37"/><text x="790.0" y="54.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="end">capture edge (flip-flop 2)</text><text x="470.0" y="218.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">T  &gt;=  t_clk-to-q  +  (LUT + route) x levels  +  t_setup        slack = T - (that sum); negative slack = the circuit fails at this clock</text><text x="470.0" y="244.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">hold is the other check: the data must not change too soon AFTER the capturing edge (it concerns the SAME edge, so no clock period fixes it)</text><text x="470.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">the router fixes hold by adding delay; the designer fixes setup by shortening the path or slowing the clock</text></svg>