<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-label="RTO"><title>RTO</title><rect x="0.5" y="0.5" width="979" height="359" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The retransmission timer (RFC 6298) in fixed point</text><rect x="40.0" y="60.0" width="420.0" height="110.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="250.0" y="96.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="middle">each new ACK that covers the timed segment gives a sample R</text><text x="250.0" y="111.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="middle">err = R - srtt</text><text x="250.0" y="126.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="middle">srtt8 += err          (srtt8 = 8 x SRTT: alpha = 1/8)</text><text x="250.0" y="141.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="middle">rv4 += |err| - rv4/4   (rv4 = 4 x RTTVAR: beta = 1/4)</text><rect x="40.0" y="190.0" width="420.0" height="70.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="250.0" y="221.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="middle">RTO = SRTT + max(1 tick, 4 x RTTVAR) = (srtt8 &gt;&gt; 3) + max(1, rv4)</text><text x="250.0" y="236.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="middle">clamped to [RTO_MIN, RTO_MAX]</text><rect x="500.0" y="60.0" width="440.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="720.0" y="89.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">timer fires (now &gt;= deadline):</text><text x="720.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">RTO doubles (up to RTO_MAX); no sample from the retransmission</text><text x="720.0" y="119.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">(Karn); SND.NXT goes back to SND.UNA; one segment is resent</text><rect x="500.0" y="160.0" width="440.0" height="100.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="720.0" y="191.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">the first sample sets  srtt8 = 8R,  rv4 = 2R</text><text x="720.0" y="206.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">(SRTT = R, RTTVAR = R/2, RTO = 3R);</text><text x="720.0" y="221.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">when new data is acknowledged without a sample, the backed-off</text><text x="720.0" y="236.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">RTO is recomputed from SRTT and RTTVAR (a deliberate deviation)</text><text x="490.0" y="320.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">the integers carry the fractions, so the truncation of the shifts does not accumulate (Example B)</text></svg>