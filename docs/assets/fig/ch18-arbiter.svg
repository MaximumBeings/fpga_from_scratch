<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="Arbiter"><title>Arbiter</title><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">seq_arb: two feeds and a retransmission server into one in-order stream, with a window of pending packets and a gap timer</text><rect x="30.0" y="70.0" width="140.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="100.0" y="104.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">feed A</text><rect x="30.0" y="160.0" width="140.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="100.0" y="194.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">feed B</text><rect x="30.0" y="250.0" width="140.0" height="60.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="100.0" y="276.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">retransmission</text><text x="100.0" y="291.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">server</text><rect x="260.0" y="110.0" width="230.0" height="170.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="375.0" y="163.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">classify by d = seq - next</text><text x="375.0" y="177.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">d = 0: forward</text><text x="375.0" y="191.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">behind: duplicate (or overlap: error)</text><text x="375.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ahead: store in a slot,</text><text x="375.0" y="220.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">or drop if all slots are full</text><text x="375.0" y="234.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">stored packet in order: release</text><rect x="570.0" y="70.0" width="170.0" height="90.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="655.0" y="104.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">window: PEND slots</text><text x="655.0" y="119.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(distance from next,</text><text x="655.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">count, feed)</text><rect x="570.0" y="200.0" width="170.0" height="80.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="655.0" y="229.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">gap timer</text><text x="655.0" y="244.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">TO: request</text><text x="655.0" y="259.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">TO2: give up (skip)</text><rect x="800.0" y="110.0" width="150.0" height="70.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="875.0" y="134.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">in-order stream</text><text x="875.0" y="149.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(one packet per</text><text x="875.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">cycle at most)</text><rect x="800.0" y="220.0" width="150.0" height="60.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="875.0" y="246.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">request / skip</text><text x="875.0" y="261.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">events</text><line x1="172.0" y1="100.0" x2="254.3" y2="186.1" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="258.0,190.0 249.7,186.6 255.0,181.5" fill="#1f2a37"/><line x1="172.0" y1="190.0" x2="252.6" y2="190.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="258.0,190.0 249.8,193.7 249.8,186.3" fill="#1f2a37"/><line x1="172.0" y1="280.0" x2="253.6" y2="223.1" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="258.0,220.0 253.4,227.7 249.2,221.7" fill="#1f2a37"/><line x1="492.0" y1="160.0" x2="563.2" y2="122.5" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="568.0,120.0 562.4,127.1 559.0,120.6" fill="#1f2a37"/><line x1="568.0" y1="130.0" x2="498.6" y2="172.2" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="494.0,175.0 499.1,167.6 502.9,173.9" fill="#1f2a37"/><line x1="742.0" y1="120.0" x2="792.9" y2="138.2" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="798.0,140.0 789.0,140.7 791.5,133.8" fill="#1f2a37"/><line x1="742.0" y1="240.0" x2="792.7" y2="249.1" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="798.0,250.0 789.3,252.2 790.6,244.9" fill="#1f2a37"/><line x1="494.0" y1="230.0" x2="562.6" y2="239.3" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="568.0,240.0 559.4,242.5 560.3,235.3" fill="#1f2a37"/><line x1="868.0" y1="282.0" x2="868.0" y2="324.6" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="868.0,330.0 864.3,321.8 871.7,321.8" fill="#1f2a37"/><text x="660.0" y="345.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">a request goes to the server; its answer comes back as feed 2</text><text x="490.0" y="385.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">all decisions are taken from the state at the start of the cycle; a release or a skip stops the input for that cycle</text></svg>