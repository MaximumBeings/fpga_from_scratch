<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="Book"><title>Book</title><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The book: an associative order table, and per symbol two sorted arrays of price levels</text><rect x="30.0" y="140.0" width="150.0" height="90.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="105.0" y="174.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">event</text><text x="105.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">ADD, EXEC, CANCEL,</text><text x="105.0" y="204.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">DELETE, REPLACE</text><rect x="260.0" y="70.0" width="270.0" height="130.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="395.0" y="116.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">order table (NO entries)</text><text x="395.0" y="131.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">ref, symbol, side, price, shares</text><text x="395.0" y="146.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">every entry compared with the reference</text><text x="395.0" y="161.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">in one cycle (an associative search)</text><rect x="260.0" y="230.0" width="270.0" height="130.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="395.0" y="276.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">levels: NS symbols x 2 sides x D</text><text x="395.0" y="291.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">sorted, best price first, contiguous</text><text x="395.0" y="306.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">p = levels better than the price</text><text x="395.0" y="321.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">insert: shift down; remove: shift up</text><rect x="620.0" y="140.0" width="170.0" height="90.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="705.0" y="174.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">result + symbol</text><text x="705.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">OK, UNK, FULL, LVL,</text><text x="705.0" y="204.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">OVER, DUPREF, ZERO</text><rect x="820.0" y="140.0" width="140.0" height="90.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="890.0" y="174.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">top of book</text><text x="890.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">bid, ask, levels,</text><text x="890.0" y="204.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">orders</text><line x1="182.0" y1="170.0" x2="253.2" y2="132.5" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="258.0,130.0 252.4,137.1 249.0,130.6" fill="#1f2a37"/><line x1="395.0" y1="202.0" x2="395.0" y2="222.6" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="395.0,228.0 391.3,219.8 398.7,219.8" fill="#1f2a37"/><line x1="532.0" y1="130.0" x2="613.2" y2="172.5" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="618.0,175.0 609.0,174.4 612.4,167.9" fill="#1f2a37"/><line x1="532.0" y1="290.0" x2="614.2" y2="208.8" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="618.0,205.0 614.7,213.4 609.6,208.2" fill="#1f2a37"/><line x1="792.0" y1="185.0" x2="812.6" y2="185.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="818.0,185.0 809.8,188.7 809.8,181.3" fill="#1f2a37"/><text x="490.0" y="385.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">one event per cycle; REPLACE takes two (delete the old order, add the new) and the input waits</text></svg>