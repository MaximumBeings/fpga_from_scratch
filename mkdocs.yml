site_name: "FPGA from Scratch -- Under Development"
site_description: "FPGA design from first principles with an open toolchain: Ethernet, TCP, market data, order books and pre-trade risk for high-frequency trading as the main case study, then signal processing, security, vision, control, genomics and machine-learning case studies. Python golden models, two simulators, mutation-tested."
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  logo: assets/kestrel-logo.svg
  favicon: assets/kestrel-favicon.svg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Contents (the whole plan): contents.md
  - "Part 1 -- Foundations":
      - "1. What an FPGA Is: Lookup Tables, the Carry Chain, and the Open Flow": part01/01-what-an-fpga-is.md
      - "2. Hardware Design in SystemVerilog: A Portable Subset, Valid/Ready Stages, State Machines, and Lint": part01/02-systemverilog.md
      - "3. Timing and Clock Domains: Setup and Hold, Reading a Timing Report, Reset, Synchronizers, and the Asynchronous FIFO": part01/03-timing-and-cdc.md
      - "4. Latency as a Budget: Pipelines, Cut-Through Against Store-and-Forward, and Determinism": part01/04-latency-budget.md
      - "5. Resources: Fixed-Point Arithmetic, DSP Blocks, Block RAM, and Moving Registers": part01/05-resources.md
      - "6. A Verification Harness: Vector Replay, Random and Constrained Stimulus, Coverage, Formal Properties, and Mutation Testing": part01/06-verification-harness.md
  - "Part 2 -- Ethernet":
      - "7. Frames and the CRC: Ethernet Frame Check, Parallel CRC-32 at 64 Bits per Beat": part02/07-frames-and-crc.md
      - "8. The MAC Datapath: Receive and Transmit at the Byte Interface, a Block-RAM Frame Buffer, and the Clock Boundary": part02/08-mac-datapath.md
      - "9. Headers at Line Rate: A Byte-Serial VLAN, IPv4 and UDP Filter, the Internet Checksum, and Why the First Version Ran at Half the Clock": part02/09-headers-at-line-rate.md
      - "10. Match Engines: CAM, Ternary CAM, Range Matcher and Hash Tables, What Each Costs, and Where a Cheap Hash Fails": part02/10-match-engines.md
      - "11. Egress: Building UDP Frames, Store-and-Forward Against Cut-Through, and a Token-Bucket Pacer": part02/11-egress.md
  - "Part 3 -- Reliable transport: TCP":
      - "12. The TCP State Machine: Segment Acceptance in Hardware, a Table of Connections, and What Must Be on the Hot Path": part03/12-tcp-state-machine.md
      - "13. The TCP Send Side: Window, Cumulative ACK, the RFC 6298 Retransmission Timer, and a Scanner for Many Timers": part03/13-send-side-and-timers.md
      - "14. Testing the Stack Against an Independent Reference: Loss, Reordering, Duplication, Forged Segments, and the Bug It Found": part03/14-interop-and-reference.md
      - "15. Hot Path and Cold Path: Splitting TCP Between Hardware and Software, Keeping the Order, Head-of-Line Blocking, and Reconnects": part03/15-hot-and-cold-path.md
  - "Part 4 -- Market data":
      - "16. Exchange Protocols: MoldUDP64 and ITCH, and a Generator That Turns a Message Grammar into a Parser": part04/16-exchange-protocols.md
  - Appendices:
      - "H. Answers to the Self-Check Questions": answers.md
