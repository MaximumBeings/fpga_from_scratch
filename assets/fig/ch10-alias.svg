<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Multicast"><title>Multicast</title><rect x="0.5" y="0.5" width="959" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">An IPv4 multicast group is 28 bits; its Ethernet address keeps 23</text><rect x="40.0" y="70.0" width="90.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="85.0" y="99.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">1110</text><rect x="130.0" y="70.0" width="150.0" height="50.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="205.0" y="99.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">5 bits: LOST</text><rect x="280.0" y="70.0" width="340.0" height="50.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="450.0" y="99.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">23 bits kept</text><text x="85.0" y="140.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">224.0.0.0/4</text><text x="205.0" y="140.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">bits 27..23</text><text x="450.0" y="140.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">bits 22..0</text><rect x="40.0" y="190.0" width="580.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="330.0" y="219.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">01:00:5E  +  0 + 23 bits   =  the destination MAC</text><line x1="450.0" y1="122.0" x2="450.0" y2="182.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="450.0,188.0 446.3,179.8 453.7,179.8" fill="#1f2a37"/><text x="700.0" y="100.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="start" font-weight="bold">32 different groups share one MAC address:</text><text x="700.0" y="120.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#c53030" text-anchor="start">224.1.1.1, 225.1.1.1, ... 239.1.1.1</text><text x="700.0" y="150.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="start">a filter on the MAC address cannot tell them apart</text><text x="480.0" y="280.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">an exact filter on the MAC accepts every alias of a subscribed group; only the IP address tells them apart</text></svg>