<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="Fast"><title>Fast</title><rect x="0.5" y="0.5" width="939" height="339" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">crc32_fast: the data part is feed-forward; only A_8 is in the loop</text><rect x="20.0" y="70.0" width="120.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="80.0" y="91.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">input regs</text><text x="80.0" y="106.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">d, nbytes, last</text><rect x="180.0" y="40.0" width="150.0" height="46.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="255.0" y="66.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">B_8(d)  (3 levels)</text><rect x="180.0" y="100.0" width="150.0" height="46.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="255.0" y="126.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">B_k(d), k = nbytes</text><rect x="370.0" y="40.0" width="90.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="415.0" y="66.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">reg</text><rect x="370.0" y="100.0" width="90.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="415.0" y="126.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">reg</text><rect x="510.0" y="30.0" width="180.0" height="70.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="600.0" y="54.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">loop: st &lt;= A_8(st) ^ B_8</text><text x="600.0" y="68.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(at most 19 + 1 inputs)</text><text x="600.0" y="83.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">restart after the last beat</text><rect x="510.0" y="150.0" width="180.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="600.0" y="174.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">snapshot of st, B_k on the</text><text x="600.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">last beat</text><rect x="740.0" y="150.0" width="170.0" height="56.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="825.0" y="174.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">x5 = A_k(snapshot) ^ B_k</text><text x="825.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(k picks one of eight A_k)</text><rect x="740.0" y="240.0" width="170.0" height="50.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="825.0" y="261.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">out_crc = ~x5</text><text x="825.0" y="276.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">out_good = (~x5 == residue)</text><line x1="142.0" y1="95.0" x2="174.0" y2="66.6" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="178.0,63.0 174.3,71.2 169.4,65.7" fill="#1f2a37"/><line x1="142.0" y1="100.0" x2="173.4" y2="120.1" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="178.0,123.0 169.1,121.7 173.1,115.5" fill="#1f2a37"/><line x1="332.0" y1="63.0" x2="362.6" y2="63.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="368.0,63.0 359.8,66.7 359.8,59.3" fill="#1f2a37"/><line x1="332.0" y1="123.0" x2="362.6" y2="123.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="368.0,123.0 359.8,126.7 359.8,119.3" fill="#1f2a37"/><line x1="462.0" y1="63.0" x2="502.6" y2="63.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="508.0,63.0 499.8,66.7 499.8,59.3" fill="#1f2a37"/><line x1="462.0" y1="123.0" x2="504.2" y2="166.1" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="508.0,170.0 499.6,166.7 504.9,161.6" fill="#1f2a37"/><line x1="692.0" y1="178.0" x2="732.6" y2="178.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="738.0,178.0 729.8,181.7 729.8,174.3" fill="#1f2a37"/><line x1="825.0" y1="208.0" x2="825.0" y2="232.6" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="825.0,238.0 821.3,229.8 828.7,229.8" fill="#1f2a37"/><path d="M600,100 C600,115 600,130 600,148" fill="none" stroke="#c53030" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="470.0" y="320.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">latency 5 cycles; the long pieces (B and A_k) are outside the loop, so they are cut by registers; only the 20-input loop limits the clock</text></svg>