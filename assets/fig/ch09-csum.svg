<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Accumulators"><title>Accumulators</title><rect x="0.5" y="0.5" width="959" height="339" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Three ways to add 16-bit words with a ones' complement carry, one byte per clock</text><rect x="20.0" y="44.0" width="300.0" height="275.0" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2" opacity="0.5"/><text x="170.0" y="66.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">csum_e2e: fold in the same cycle</text><text x="170.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle" font-style="italic">register(16) = fold(register + word)</text><rect x="335.0" y="44.0" width="300.0" height="275.0" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2" opacity="0.5"/><text x="485.0" y="66.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">csum_def: defer the carry (bit 16)</text><text x="485.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle" font-style="italic">register(17) = low16 + carry + word</text><rect x="650.0" y="44.0" width="300.0" height="275.0" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2" opacity="0.5"/><text x="800.0" y="66.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">csum_lane: two lanes, fold once</text><text x="800.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#51606f" text-anchor="middle" font-style="italic">even bytes + odd bytes, 20 bits each</text><rect x="40.0" y="130.0" width="90.0" height="40.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="85.0" y="153.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">word</text><rect x="160.0" y="120.0" width="70.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="195.0" y="146.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">adder 1</text><text x="195.0" y="160.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">16 + 16</text><rect x="40.0" y="205.0" width="90.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="85.0" y="228.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">register 16</text><rect x="160.0" y="200.0" width="70.0" height="50.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="195.0" y="221.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">adder 2</text><text x="195.0" y="235.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">+ carry</text><rect x="250.0" y="205.0" width="56.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="278.0" y="228.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">reg</text><line x1="130.0" y1="150.0" x2="152.6" y2="150.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="158.0,150.0 149.8,153.7 149.8,146.3" fill="#1f2a37"/><line x1="195.0" y1="182.0" x2="195.0" y2="192.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="195.0,198.0 191.3,189.8 198.7,189.8" fill="#1f2a37"/><text x="240.0" y="195.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">carry</text><line x1="228.0" y1="225.0" x2="242.6" y2="225.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="248.0,225.0 239.8,228.7 239.8,221.3" fill="#1f2a37"/><text x="160.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#c53030" text-anchor="middle" font-weight="bold">two carry chains in a row</text><rect x="355.0" y="130.0" width="90.0" height="40.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="400.0" y="153.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">word</text><rect x="468.0" y="120.0" width="110.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="523.0" y="140.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">adder</text><text x="523.0" y="153.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">low16 + carry</text><text x="523.0" y="166.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle" font-weight="bold">+ word</text><rect x="475.0" y="205.0" width="120.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="535.0" y="228.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">register 17 (carry in bit 16)</text><line x1="445.0" y1="150.0" x2="460.6" y2="150.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="466.0,150.0 457.8,153.7 457.8,146.3" fill="#1f2a37"/><line x1="520.0" y1="182.0" x2="520.0" y2="197.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="520.0,203.0 516.3,194.8 523.7,194.8" fill="#1f2a37"/><path d="M600,225 C625,225 625,150 568,150" fill="none" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="380.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="start" font-weight="bold">one carry chain; fold once at the end (or compare:</text><text x="380.0" y="286.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="start" font-weight="bold">0xFFFF without carry, 0xFFFE with carry)</text><rect x="670.0" y="120.0" width="70.0" height="40.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="705.0" y="143.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">even byte</text><rect x="670.0" y="172.0" width="70.0" height="40.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="705.0" y="195.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">odd byte</text><rect x="760.0" y="120.0" width="80.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="800.0" y="143.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">+= lane A</text><rect x="760.0" y="172.0" width="80.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="800.0" y="195.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">+= lane B</text><line x1="740.0" y1="140.0" x2="752.6" y2="140.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="758.0,140.0 749.8,143.7 749.8,136.3" fill="#1f2a37"/><line x1="740.0" y1="192.0" x2="752.6" y2="192.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="758.0,192.0 749.8,195.7 749.8,188.3" fill="#1f2a37"/><rect x="740.0" y="228.0" width="150.0" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="815.0" y="249.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle">A x 256 + B, fold once</text><text x="800.0" y="285.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="middle" font-weight="bold">8-bit additions, no word formed</text><text x="800.0" y="300.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="middle" font-weight="bold">in the stream</text></svg>