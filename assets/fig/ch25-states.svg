<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="States"><title>States</title><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">An order in the tracker: three states, and the exits</text><rect x="30.0" y="150.0" width="130.0" height="60.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="95.0" y="183.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(not in table)</text><rect x="230.0" y="150.0" width="150.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="305.0" y="176.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">PENDING_NEW</text><text x="305.0" y="191.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">sent, not acknowledged</text><rect x="470.0" y="150.0" width="130.0" height="60.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="535.0" y="176.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">LIVE</text><text x="535.0" y="191.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">acknowledged</text><rect x="700.0" y="150.0" width="190.0" height="60.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="795.0" y="176.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">PENDING_CANCEL</text><text x="795.0" y="191.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">cancel requested</text><rect x="470.0" y="270.0" width="200.0" height="60.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="570.0" y="303.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">gone: released and freed</text><line x1="162.0" y1="180.0" x2="222.6" y2="180.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="228.0,180.0 219.8,183.7 219.8,176.3" fill="#1f2a37"/><line x1="382.0" y1="180.0" x2="462.6" y2="180.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="468.0,180.0 459.8,183.7 459.8,176.3" fill="#1f2a37"/><line x1="602.0" y1="180.0" x2="692.6" y2="180.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="698.0,180.0 689.8,183.7 689.8,176.3" fill="#1f2a37"/><line x1="530.0" y1="212.0" x2="530.0" y2="262.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="530.0,268.0 526.3,259.8 533.7,259.8" fill="#1f2a37"/><line x1="300.0" y1="212.0" x2="464.9" y2="273.1" stroke="#1f2a37" stroke-width="1.2" stroke-linecap="round"/><polygon points="470.0,275.0 461.0,275.6 463.6,268.7" fill="#1f2a37"/><line x1="790.0" y1="212.0" x2="674.6" y2="282.2" stroke="#1f2a37" stroke-width="1.2" stroke-linecap="round"/><polygon points="670.0,285.0 675.1,277.6 678.9,283.9" fill="#1f2a37"/><text x="195.0" y="170.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">NEW</text><text x="425.0" y="170.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">ACK or FILL</text><text x="650.0" y="170.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">cancel request</text><text x="560.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="start">FILL to zero, CANCELED</text><text x="330.0" y="255.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">REJECT</text><text x="490.0" y="375.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">any report that does not fit (unknown token, ACK of a live order, fill of 0 or above the remainder) sets the fault and changes nothing</text></svg>