<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Bucket"><title>Bucket</title><rect x="0.5" y="0.5" width="959" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="480.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The token bucket: credit rises by the rate every cycle, a frame needs its whole wire cost</text><rect x="60.0" y="60.0" width="260.0" height="200.0" rx="6" fill="none" stroke="#1f2a37" stroke-width="2.2"/><rect x="62.0" y="160.0" width="256.0" height="98.0" rx="2" fill="#dbeafe"/><text x="190.0" y="86.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">bucket: 2^BL bytes</text><text x="190.0" y="215.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">credit</text><line x1="60.0" y1="100.0" x2="320.0" y2="100.0" stroke="#c53030" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><text x="326.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#c53030" text-anchor="start">full: more is lost</text><line x1="100.0" y1="40.0" x2="100.0" y2="90.6" stroke="#2f855a" stroke-width="2" stroke-linecap="round"/><polygon points="100.0,96.0 96.3,87.8 103.7,87.8" fill="#2f855a"/><text x="112.0" y="52.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="start">+ rate every cycle (1/256 byte units)</text><line x1="190.0" y1="262.0" x2="190.0" y2="294.6" stroke="#dd6b20" stroke-width="2" stroke-linecap="round"/><polygon points="190.0,300.0 186.3,291.8 193.7,291.8" fill="#dd6b20"/><text x="200.0" y="296.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#dd6b20" text-anchor="start">- cost when a frame is granted</text><rect x="520.0" y="70.0" width="260.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="650.0" y="94.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">request: length L</text><text x="650.0" y="109.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">cost = (L + 24) bytes</text><rect x="520.0" y="170.0" width="260.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="650.0" y="194.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">grant when credit &gt;= cost</text><text x="650.0" y="209.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(registered comparison)</text><line x1="560.0" y1="128.0" x2="560.0" y2="162.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="560.0,168.0 556.3,159.8 563.7,159.8" fill="#1f2a37"/><text x="664.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="start">wire cost: preamble 8 + frame</text><text x="664.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="start">(padded to 60) + FCS 4 + gap 12</text><text x="520.0" y="240.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">long run: spacing = cost x 256 / rate cycles</text><text x="520.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">burst: 1 + floor((bucket - cost) / (cost x (1 - rate/256)))</text><text x="480.0" y="310.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">in any interval the grants add up to at most: bucket + rate x length of the interval</text></svg>