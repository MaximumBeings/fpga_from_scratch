.0" y="278.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">ACK, FILL, CANCELED,</text><text x="780.0" y="293.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">REJECT (token, qty)</text><rect x="700.0" y="60.0" width="160.0" height="80.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="780.0" y="89.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">to the wire</text><text x="780.0" y="103.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(Chapter 24 encoder)</text><text x="780.0" y="118.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">answer 0 = send</text><line x1="142.0" y1="190.0" x2="175.8" y2="114.9" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="178.0,110.0 178.0,119.0 171.3,116.0" fill="#1f2a37"/><line x1="352.0" y1="100.0" x2="412.6" y2="100.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="418.0,100.0 409.8,103.7 409.8,96.3" fill="#1f2a37"/><line x1="300.0" y1="142.0" x2="435.4" y2="225.2" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="440.0,228.0 431.1,226.8 434.9,220.6" fill="#1f2a37"/><line x1="698.0" y1="270.0" x2="627.4" y2="274.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="622.0,275.0 630.0,270.8 630.4,278.1" fill="#1f2a37"/><line x1="520.0" y1="228.0" x2="520.0" y2="157.4" stroke="#2f855a" stroke-width="1.8" stroke-linecap="round"/><polygon points="520.0,152.0 523.7,160.2 516.3,160.2" fill="#2f855a"/><line x1="352.0" y1="9