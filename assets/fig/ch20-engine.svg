t-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">SHU: remove</text><rect x="560.0" y="150.0" width="120.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="620.0" y="179.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">WOM</text><text x="620.0" y="193.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">write the order,</text><text x="620.0" y="208.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">result</text><rect x="740.0" y="40.0" width="220.0" height="110.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="850.0" y="77.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">order RAM</text><text x="850.0" y="91.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">NB x K words: valid, ref,</text><text x="850.0" y="106.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">symbol, side, price, shares</text><text x="850.0" y="120.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">cleared after reset (NB x K cycles)</text><rect x="740.0" y="170.0" width="220.0" height="110.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="850.0" y="207.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">level RAM</text><text x="850.0" y="221.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">NS x 2 x D: price, shares</text><text x="850.0" y="236.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">sorted, best first, contiguous</text><text x="850.0" y="250.3" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">one word per cycle</text><rect x="740.0" y="300.0" width="220.0" height="90.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="850.0" y="334.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">registers</text><text x="850.0" y="348.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">levels per side, best level</text><text x="850.0" y="363.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">(price, shares), order count</text><line x1="142.0" y1="190.0" x2="185.5" y2="104.8" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="188.0,100.0 187.5,109.0 181.0,105.6" fill="#1f2a37"/><line x1="255.0" y1="122.0" x2="255.0" y2="142.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="255.0,148.0 251.3,139.8 258.7,139.8" fill="#1f2a37"/><line x1="255.0" y1="212.0" x2="255.0" y2="232.6" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="255.0,238.0 251.3,229.8 258.7,229.8" fill="#1f2a37"/><line x1="322.0" y1="255.0" x2="375.9" y2="130.0" stroke="#1f2a37" stroke-width="1.4" stroke-linecap="round"/><polygon points="378.0,125.0 378.1,134.0 