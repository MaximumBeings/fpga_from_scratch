<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="Engine"><title>Engine</title><rect x="0.5" y="0.5" width="979" height="419" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The engine: two RAMs read one entry per cycle, a few registers, one event at a time</text><rect x="20.0" y="150.0" width="120.0" height="80.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="80.0" y="179.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">event</text><text x="80.0" y="194.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">in_valid,</text><text x="80.0" y="209.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">in_ready</text><rect x="190.0" y="60.0" width="130.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="255.0" y="79.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">LK</text><text x="255.0" y="93.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">K + 1 reads of</text><text x="255.0" y="108.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">the bucket</text><rect x="190.0" y="150.0" width="130.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="255.0" y="169.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Hel