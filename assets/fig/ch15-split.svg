<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="Split"><title>Split</title><rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">tcp_split: one event per cycle, a hot path in hardware, a cold path in software, and a count that keeps the order</text><rect x="30.0" y="150.0" width="130.0" height="90.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="95.0" y="184.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">event</text><text x="95.0" y="199.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(segment or</text><text x="95.0" y="214.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">command)</text><rect x="220.0" y="120.0" width="250.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="345.0" y="154.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">table of connections</text><text x="345.0" y="169.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">state, SND.UNA, SND.NXT,</text><text x="345.0" y="184.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">RCV.NXT, count pending</text><text x="345.0" y="199.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold"></text><text x="345.0" y="214.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">tcp_fast: ESTABLISHED, ACK,</text><text x="345.0" y="228.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">seq = RCV.NXT, in window,</text><text x="345.0" y="243.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">nothing pending?</text><rect x="560.0" y="60.0" width="190.0" height="80.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="655.0" y="89.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">HOT: update RCV.NXT,</text><text x="655.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">ACK out, bytes delivered</text><text x="655.0" y="119.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(this cycle)</text><rect x="560.0" y="190.0" width="190.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="655.0" y="219.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">punt FIFO</text><text x="655.0" y="234.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">entry + state snapshot</text><text x="655.0" y="249.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">+ first flag</text><rect x="790.0" y="190.0" width="160.0" height="80.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="870.0" y="219.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">SOFTWARE</text><text x="870.0" y="234.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">full state machine</text><text x="870.0" y="249.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">L cycles per entry</text><line x1="162.0" y1="195.0" x2="212.6" y2="195.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="218.0,195.0 209.8,198.7 209.8,191.3" fill="#1f2a37"/><line x1="472.0" y1="160.0" x2="553.3" y2="112.7" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="558.0,110.0 552.7,117.3 549.1,111.0" fill="#1f2a37"/><line x1="472.0" y1="230.0" x2="552.6" y2="230.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="558.0,230.0 549.8,233.7 549.8,226.3" fill="#1f2a37"/><line x1="752.0" y1="230.0" x2="782.6" y2="230.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="788.0,230.0 779.8,233.7 779.8,226.3" fill="#1f2a37"/><path d="M870,272 C870,340 345,340 345,272" fill="none" stroke="#c53030" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="600.0" y="334.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c53030" text-anchor="middle">write-back: state, count - 1 (the count is what keeps the order of events per connection)</text><text x="490.0" y="372.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">FIFO full: POLICY 0 holds the event (the ones behind it wait), POLICY 1 drops it (TCP retransmits)</text></svg>