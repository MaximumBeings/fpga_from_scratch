<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" role="img" aria-label="Frame"><title>Frame</title><rect x="0.5" y="0.5" width="939" height="229" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">An Ethernet frame on the wire (sizes in bytes)</text><rect x="30.0" y="70.0" width="77.0" height="56.0" rx="4" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="68.5" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">7</text><text x="68.5" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">preamble</text><rect x="111.0" y="70.0" width="34.0" height="56.0" rx="4" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="128.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">1</text><text x="128.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">SFD</text><rect x="149.0" y="70.0" width="66.0" height="56.0" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="182.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">6</text><text x="182.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">destination</text><rect x="219.0" y="70.0" width="66.0" height="56.0" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="252.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">6</text><text x="252.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">source</text><rect x="289.0" y="70.0" width="34.0" height="56.0" rx="4" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="306.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">2</text><text x="306.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">type</text><rect x="327.0" y="70.0" width="278.3" height="56.0" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="466.1" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">46-1500</text><text x="466.1" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">payload (46 to 1500)</text><rect x="609.3" y="70.0" width="44.0" height="56.0" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="631.3" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">4</text><text x="631.3" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">FCS</text><text x="470.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">the FCS is the CRC-32 of everything from the destination address to the end of the payload</text><text x="470.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">the receiver runs the CRC over all of it, FCS included, and expects a fixed residue</text></svg>