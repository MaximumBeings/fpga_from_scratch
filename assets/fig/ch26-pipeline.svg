<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Pipeline"><title>Pipeline</title><rect x="0.5" y="0.5" width="999" height="379" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="500.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Wire to wire: bytes of a market data feed in, bytes of an order out</text><rect x="20.0" y="100.0" width="110.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="75.0" y="134.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">parser</text><text x="75.0" y="148.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">Ch 16</text><text x="75.0" y="163.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">1 byte/cycle</text><rect x="150.0" y="100.0" width="110.0" height="90.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="205.0" y="134.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">adapter + FIFO</text><text x="205.0" y="148.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">QD entries</text><text x="205.0" y="163.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">drops if full</text><rect x="280.0" y="100.0" width="120.0" height="90.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="340.0" y="134.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helve