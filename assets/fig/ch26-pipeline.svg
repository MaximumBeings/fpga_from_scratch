3030" text-anchor="middle" font-style="italic">a refusal by the transmitter comes back as a REJECT to the tracker, which gives the gate's charge back</text><text x="500.0" y="360.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-style="italic">total = wait + n + F + 11 + x: 35 cycles at best (n = 11, F = 12, x = 1)</text></svg>