<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-label="Pipeline"><title>Pipeline</title><rect x="0.5" y="0.5" width="979" height="379" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">tcp_tab2: the state in a RAM, the arithmetic and the choice in separate stages</text><rect x="30.0" y="70.0" width="170.0" height="110.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="115.0" y="114.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">0  event in</text><text x="115.0" y="129.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">read the RAM at the</text><text x="115.0" y="144.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">connection id</text><rect x="220.0" y="70.0" width="170.0" height="110.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="305.0" y="106.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">1  arithmetic</text><text x="305.0" y="121.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">differences, sums,</text><text x="305.0" y="136.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">equalities from the</text><text x="305.0" y="151.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">state read</text><line x1="202.0" y1="125.0" x2="212.6" y2="125.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="218.0,125.0 209.8,128.7 209.8,121.3" fill="#1f2a37"/><rect x="410.0" y="70.0" width="170.0" height="110.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="495.0" y="106.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">1b  comparisons</text><text x="495.0" y="121.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">window and ACK tests</text><text x="495.0" y="136.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">from the differences</text><text x="495.0" y="151.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(4-stage design)</text><line x1="392.0" y1="125.0" x2="402.6" y2="125.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="408.0,125.0 399.8,128.7 399.8,121.3" fill="#1f2a37"/><rect x="600.0" y="70.0" width="170.0" height="110.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="685.0" y="106.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">2  choice</text><text x="685.0" y="121.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">new state, segment to</text><text x="685.0" y="136.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">send, bytes delivered;</text><text x="685.0" y="151.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">write back</text><line x1="582.0" y1="125.0" x2="592.6" y2="125.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="598.0,125.0 589.8,128.7 589.8,121.3" fill="#1f2a37"/><rect x="790.0" y="70.0" width="170.0" height="110.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="875.0" y="121.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">result</text><text x="875.0" y="136.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">registered</text><line x1="772.0" y1="125.0" x2="782.6" y2="125.0" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="788.0,125.0 779.8,128.7 779.8,121.3" fill="#1f2a37"/><text x="490.0" y="215.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">an event for the SAME connection must wait until the previous one has been written back:</text><text x="490.0" y="235.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">ev_ready is low while its connection id is in any stage</text><text x="490.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">events for different connections enter one per cycle; the bypass of the first design (tcp_tab) removed the wait</text><text x="490.0" y="280.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">at the price of a longer path</text><text x="490.0" y="312.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">latency 3 or 4 cycles, throughput one event per cycle across connections; for one connection one event per 3 or 4 cycles</text><text x="490.0" y="345.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">per-connection state: 4 + 1 + 32 + 32 + 32 = 101 bits</text></svg>