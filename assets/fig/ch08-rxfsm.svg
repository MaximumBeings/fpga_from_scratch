<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="RX FSM"><title>RX FSM</title><rect x="0.5" y="0.5" width="939" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">mac_rx: finding a frame and removing the FCS</text><circle cx="100.0" cy="130.0" r="40.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="100.0" y="135.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">IDLE</text><circle cx="300.0" cy="130.0" r="40.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="300.0" y="135.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">PRE</text><circle cx="520.0" cy="130.0" r="40.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="520.0" y="135.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">DATA</text><circle cx="300.0" cy="225.0" r="40.0" fill="#dbeafe" stroke="#2b6cb0" stroke-width="2.2"/><text x="300.0" y="230.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">IGN</text><line x1="142.0" y1="125.0" x2="252.6" y2="125.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="258.0,125.0 249.8,128.7 249.8,121.3" fill="#1f2a37"/><text x="200.0" y="112.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">dv &amp; byte = 0x55</text><line x1="342.0" y1="125.0" x2="472.6" y2="125.0" stroke="#1f2a37" stroke-width="1.7" stroke-linecap="round"/><polygon points="478.0,125.0 469.8,128.7 469.8,121.3" fill="#1f2a37"/><text x="410.0" y="112.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#1f2a37" text-anchor="middle">byte = 0xD5 (SFD)</text><line x1="122.0" y1="168.0" x2="256.9" y2="212.3" stroke="#1f2a37" stroke-width="1.5" stroke-linecap="round"/><polygon points="262.0,214.0 253.0,214.9 255.3,207.9" fill="#1f2a37"/><text x="150.0" y="208.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle">other byte</text><line x1="300.0" y1="172.0" x2="300.0" y2="176.6" stroke="#1f2a37" stroke-width="1.5" stroke-linecap="round"/><polygon points="300.0,182.0 296.3,173.8 303.7,173.8" fill="#1f2a37"/><text x="352.0" y="178.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle">other byte</text><line x1="262.0" y1="232.0" x2="134.9" y2="174.2" stroke="#a0aec0" stroke-width="1.3" stroke-linecap="round"/><polygon points="130.0,172.0 139.0,172.1 136.0,178.7" fill="#a0aec0"/><text x="168.0" y="244.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">dv falls</text><path d="M520,90 C520,40 100,40 100,88" fill="none" stroke="#2f855a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="310.0" y="52.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#2f855a" text-anchor="middle">dv falls: mark the held byte last; bad = er | length | FCS</text><text x="660.0" y="135.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">4-byte delay line removes the FCS;</text><text x="660.0" y="153.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">CRC over every byte after the SFD;</text><text x="660.0" y="171.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">the last data byte is held one cycle</text><text x="660.0" y="189.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="start">so that dv falling can mark it</text><text x="560.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">IGN: wait for dv to fall (an unrecognised start is ignored whole)</text></svg>