<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-label="Scanner"><title>Scanner</title><rect x="0.5" y="0.5" width="979" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="490.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">tx_tab: a RAM of connection states and a scanner that visits one connection per idle cycle</text><rect x="40.0" y="80.0" width="160.0" height="70.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="120.0" y="111.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">outside events</text><text x="120.0" y="126.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">WRITE, ACK, POLL</text><rect x="40.0" y="190.0" width="160.0" height="70.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="120.0" y="214.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">scanner</text><text x="120.0" y="229.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">TICK for connection sp,</text><text x="120.0" y="244.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">sp = sp + 1</text><rect x="280.0" y="120.0" width="120.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="340.0" y="149.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">choose</text><text x="340.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">one per cycle</text><text x="340.0" y="179.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">outside first</text><rect x="470.0" y="120.0" width="150.0" height="80.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="545.0" y="149.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">RAM read</text><text x="545.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">339 bits per</text><text x="545.0" y="179.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">connection</text><rect x="690.0" y="120.0" width="120.0" height="80.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="750.0" y="156.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">tx_next</text><text x="750.0" y="171.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">one cycle</text><rect x="850.0" y="120.0" width="100.0" height="80.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="900.0" y="156.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">segment,</text><text x="900.0" y="171.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-we